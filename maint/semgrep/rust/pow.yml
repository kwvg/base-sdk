rules:
  - id: pow-table-not-const
    message: "declare lookup tables as `static`; a `const` array is copied onto the stack at each use in debug builds"
    severity: ERROR
    languages: [rust]
    paths:
      include: [/pkgs/pow/src/**/*.rs]
    pattern-regex: '\bconst\s+[A-Za-z_][A-Za-z0-9_]*\s*:\s*\['

name: "dash-script"

on:
  workflow_dispatch:
  push:
    paths:
      - pkgs/script/**
      - pkgs/types/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/pkg_script.yml
      - .github/workflows/build_stable.yml
      - .github/workflows/build_nightly.yml
      - contrib/nix/**
      - rust-toolchain.toml
      - uv.lock
  pull_request:
    paths:
      - pkgs/script/**
      - pkgs/types/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/pkg_script.yml
      - .github/workflows/build_stable.yml
      - .github/workflows/build_nightly.yml
      - contrib/nix/**
      - rust-toolchain.toml
      - uv.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    uses: ./.github/workflows/build_stable.yml
    with:
      package: dash-script
      package_dir: script

  nightly:
    uses: ./.github/workflows/build_nightly.yml
    with:
      package: dash-script
      package_dir: script
    secrets: inherit

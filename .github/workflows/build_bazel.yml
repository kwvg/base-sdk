name: Build with Bazel

on:
  workflow_call:
    inputs:
      package_dir:
        description: Package directory relative to pkgs/ (e.g. num)
        required: true
        type: string
    secrets:
      CACHE_GHA_AUTH:
        required: false
      CACHE_BZL_AUTH:
        required: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true' || steps.filter.outputs.bazel == 'true' || steps.filter.outputs[inputs.package_dir] == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/paths.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths.yml

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # LLVM alone unpacks to 11 GB on a Linux host.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Manage Bazel downloads
        uses: runs-on/cache@v5.0.7
        env:
          RUNS_ON_S3_BUCKET_CACHE: ${{ secrets.CACHE_GHA_AUTH && vars.CACHE_GHA_URL && vars.CACHE_GHA_BUCKET || '' }}
          RUNS_ON_S3_BUCKET_ENDPOINT: ${{ vars.CACHE_GHA_URL }}
          RUNS_ON_S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: ${{ vars.CACHE_GHA_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.CACHE_GHA_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_GHA_AUTH }}
        with:
          path: |
            .cache/bazel/cache/repos
            .cache/bazelisk
          key: bazel-repos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'bazel/*.MODULE.bazel') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-${{ runner.arch }}-

      # Only CI runners reach the cache, so `.bazelrc` leaves it out. The
      # credential stays out of the command line Bazel echoes on failure.
      - name: Configure the remote cache
        if: vars.CACHE_BZL_URL != ''
        env:
          CACHE_BZL_URL: ${{ vars.CACHE_BZL_URL }}
          CACHE_BZL_AUTH: ${{ secrets.CACHE_BZL_AUTH }}
        run: |
          echo "build --remote_cache=${CACHE_BZL_URL}" >> .bazelrc.user
          if [ "${{ github.event_name }}" = push ] && { [ "${{ github.ref }}" = refs/heads/develop ] || [ "${{ github.ref }}" = refs/heads/runner_p1 ]; } && [ -n "${CACHE_BZL_AUTH}" ]; then
            echo "build \"--remote_header=Authorization=Basic ${CACHE_BZL_AUTH}\"" >> .bazelrc.user
          else
            echo "build --remote_upload_local_results=false" >> .bazelrc.user
          fi

      - name: Build every target
        run: just ${{ inputs.package_dir }}::zbuild

      - name: Build every target with the release profile
        run: just ${{ inputs.package_dir }}::zbuild -c opt

      - name: Check the output root
        run: test -d .cache/bazel/install

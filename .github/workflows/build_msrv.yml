name: MSRV (1.85)

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # x86_64, not aarch64: CodeQL publishes no arm64 Linux build, and though
  # the devshell can emulate its extractors it costs about four times the
  # analysis time. Every other linter is arch-neutral, so they ride along.
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: nix develop ./contrib/nix#ci --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Restore cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage CodeQL packs
        uses: actions/cache@v5
        with:
          path: ~/.codeql
          key: codeql-packs-${{ hashFiles('maint/codeql/codeql-pack.lock.yml') }}

      - name: Run linters
        run: python3 maint/lint_all.py --exclude lint_codeql

      - name: Run CodeQL
        run: python3 maint/lint/lint_codeql.py --with-suite=rust-security-and-quality

      - name: Check PR commit messages
        if: github.event_name == 'pull_request'
        run: >
          python3 maint/lint/lint_unconv.py
          -r "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  build:
    name: Build and test
    runs-on: ubuntu-24.04-arm

    # The same shell the linters use. `cargo` in it is the nightly, so the
    # floor is asked for by path through TOOLCHAIN_MSRV; `lint_cargo.py` holds
    # that version equal to the Cargo.toml floor.
    defaults:
      run:
        shell: nix develop ./contrib/nix#ci --command bash -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Restore cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-build-msrv-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cargo-build-msrv-${{ runner.os }}-${{ runner.arch }}-

      - name: Build workspace
        run: |
          "$TOOLCHAIN_MSRV/bin/cargo" build --workspace --exclude dash-pow --features full
          "$TOOLCHAIN_MSRV/bin/cargo" build -p dash-pow --features std,aes_hw

      - name: Test workspace
        run: |
          "$TOOLCHAIN_MSRV/bin/cargo" test --workspace --exclude dash-pow --features full
          "$TOOLCHAIN_MSRV/bin/cargo" test -p dash-pow --features std,aes_hw

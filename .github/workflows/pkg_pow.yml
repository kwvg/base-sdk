name: "dash-pow"

on:
  workflow_dispatch:
  push:
    paths:
      - pkgs/pow/**
      - pkgs/num/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/pkg_pow.yml
      - .github/workflows/build_stable.yml
      - .github/workflows/build_nightly.yml
      - contrib/nix/**
      - rust-toolchain.toml
      - uv.lock
  pull_request:
    paths:
      - pkgs/pow/**
      - pkgs/num/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/pkg_pow.yml
      - .github/workflows/build_stable.yml
      - .github/workflows/build_nightly.yml
      - contrib/nix/**
      - rust-toolchain.toml
      - uv.lock

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    uses: ./.github/workflows/build_stable.yml
    with:
      package: dash-pow
      package_dir: pow
      features: std

  nightly:
    uses: ./.github/workflows/build_nightly.yml
    with:
      package: dash-pow
      package_dir: pow
    secrets: inherit

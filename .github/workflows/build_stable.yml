name: Build on stable

on:
  workflow_call:
    inputs:
      package:
        description: Cargo package name (e.g. dash-num)
        required: true
        type: string
      package_dir:
        description: Package directory relative to pkgs/ (e.g. num)
        required: true
        type: string
      features:
        description: Cargo features to enable (default full)
        required: false
        type: string
        default: full

permissions:
  contents: read

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64

    name: ${{ matrix.os }} (stable)
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run pull request checks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          source .github/ci.env
          commits=${{ github.event.pull_request.commits }}
          if [ "${commits}" -gt "${MAX_PR_COMMITS}" ]; then
            echo "::error::PR has ${commits} commits (limit: ${MAX_PR_COMMITS})"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Manage cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('Cargo.lock', 'docs/samples/Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Manage build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-build-stable-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package }}-${{ github.sha }}
          restore-keys: |
            cargo-build-stable-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package }}-

      - name: Build package
        run: cargo build -p ${{ inputs.package }} --features ${{ inputs.features }}
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Build package without default features
        run: cargo build -p ${{ inputs.package }} --no-default-features
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Test package
        run: cargo test -p ${{ inputs.package }} --features ${{ inputs.features }}
        env:
          RUSTUP_TOOLCHAIN: stable

[package]
name = "dash-dev"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "bsdk-util"
path = "src/bin/bsdk_util/main.rs"
required-features = ["bin"]

[features]
default = []
std = [
  "dep:json5",
  "dep:serde_json",
  "bitcoin-consensus-encoding/std",
  "ciborium?/std",
  "dash-primitives/std",
  "dash-types/std",
  "hex-conservative/std",
]
full = ["std", "serde"]
serde = ["dep:serde", "dash-primitives/serde", "dash-types/serde"]
bin = [
  "full",
  "dep:chrono",
  "dep:ciborium",
  "dep:clap",
  "dep:dash-num",
  "dep:dash-params",
  "dep:dash-pow",
  "dep:indicatif",
  "dep:rayon",
  "dep:sysinfo",
]
_internal = []

[build-dependencies]
built = { version = "0.7", features = ["dependency-tree", "git2"] }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }

[dependencies]
bitcoin-consensus-encoding = { version = "0.2", default-features = false, features = [
  "alloc",
] }
cfg-if = { version = "1" }
dash-num = { version = "0.0.0", path = "../num", optional = true }
dash-params = { version = "0.0.0", path = "../params", optional = true }
dash-pow = { version = "0.0.0", path = "../pow", optional = true }
dash-primitives = { version = "0.0.0", path = "../primitives" }
dash-types = { version = "0.0.0", path = "../types", default-features = false }
hex-conservative = { version = "0.3", default-features = false, features = [
  "alloc",
] }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
], optional = true }
ciborium = { version = "0.2", optional = true }
clap = { version = "4", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
], optional = true }
indicatif = { version = "0.17", default-features = false, optional = true }
json5 = { version = "0.4", optional = true }
rayon = { version = "1", optional = true }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }
serde_json = { version = "1", optional = true }
sysinfo = { version = "0.33", default-features = false, features = [
  "system",
], optional = true }

[lints]
workspace = true

[package.rust-version]
workspace = true

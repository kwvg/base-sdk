[package]
name = "dash-primitives"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = [
  "bitcoin-consensus-encoding/std",
  "bitcoin-internals/std",
  "bitcoin_hashes/std",
  "bitcoin-units/std",
  "dash-num/std",
  "dash-script/std",
  "dash-types/std",
  "hex-conservative/std",
]
serde = ["dep:serde", "bitcoin-units/serde", "dash-num/serde", "dash-script/serde", "dash-types/serde"]
full = ["std", "serde"]
_internal = []

[dependencies]
bitcoin-consensus-encoding = { version = "0.2", default-features = false, features = [
  "alloc",
] }
bitcoin-internals = { version = "0.5", default-features = false }
bitcoin_hashes = { version = "0.20", default-features = false, features = [
  "alloc",
] }
bitcoin-units = { version = "0.3", default-features = false, features = [
  "alloc",
] }
dash-num = { version = "0.0.0", path = "../num" }
dash-script = { version = "0.0.0", path = "../script" }
dash-types = { version = "0.0.0", path = "../types", default-features = false }
hex-conservative = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
base58ck = "0.4"
dash-pow = { version = "0.0.0", path = "../pow" }
hex-literal = "0.4"
json5 = "0.4"
rstest = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.rust-version]
workspace = true

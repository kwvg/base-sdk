[package]
name = "dash-p2p-core"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = [
  "bitcoin-p2p-messages/std",
  "bitcoin-primitives/std",
  "dash-pkc/std",
  "dash-primitives/std",
  "dash-script/std",
  "dash-types/std",
]
serde = [
  "dep:serde",
  "bitcoin-p2p-messages/serde",
  "dash-num/serde",
  "dash-pkc/serde",
  "dash-primitives/serde",
  "dash-script/serde",
  "dash-types/serde",
]
full = ["std", "serde"]

[dependencies]
bitcoin-consensus-encoding = { workspace = true, features = ["alloc"] }
bitcoin-internals = { workspace = true }
bitcoin-p2p-messages = { workspace = true }
bitcoin-primitives = { workspace = true }
bitcoin-units = { workspace = true, features = ["alloc"] }
cfg-if = "1"
dash-num = { version = "0.0.0", path = "../num", features = ["codec"] }
dash-pkc = { version = "0.0.0", path = "../pkc", features = ["codec"] }
dash-script = { version = "0.0.0", path = "../script" }
dash-params = { version = "0.0.0", path = "../params" }
dash-primitives = { version = "0.0.0", path = "../primitives" }
dash-types = { version = "0.0.0", path = "../types", default-features = false, features = [
  "bitcoin-p2p-messages",
  "codec",
] }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
hex-conservative = "0.3"
rstest = "0.25"

[lints]
workspace = true

[package.rust-version]
workspace = true

[package]
name = "dash-pkc"
version = "0.0.0"
edition = "2021"
license = "MIT"

[[bench]]
name = "pkc"
path = "bench/main.rs"
harness = false

[dependencies]
bitcoin-consensus-encoding = { version = "0.2", default-features = false, features = [
  "alloc",
] }
bitcoin_hashes = { version = "0.20", default-features = false, features = [
  "alloc",
] }
blst = { version = "0.3", default-features = false, optional = true }
cfg-if = "1"
dash-num = { version = "0.0.0", path = "../num" }
dash-types = { version = "0.0.0", path = "../types", default-features = false }
hex-conservative = { version = "0.3", default-features = false, features = [
  "alloc",
] }
hex-literal = "0.4"
k256 = { version = "0.13", default-features = false, features = [
  "arithmetic",
  "ecdsa",
  "sha256",
], optional = true }
rand_core = { version = "0.6", default-features = false }
rayon = { version = "1", optional = true }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rstest = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
std = [
  "bitcoin_hashes/std",
  "dash-types/std",
  "dep:rayon",
  "hex-conservative/std",
  "rand_core/getrandom",
]
bls_chia = ["dep:blst", "dep:sha2"]
bls_ietf = ["dep:blst", "dep:sha2"]
k256 = ["dep:k256"]
serde = ["dep:serde", "dash-types/serde"]
full = ["k256", "bls_ietf", "bls_chia", "serde", "std"]
_internal = []

[lints]
workspace = true

[package.rust-version]
workspace = true

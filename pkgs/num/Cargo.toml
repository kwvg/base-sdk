[package]
name = "dash-num"
version = "0.0.0"
edition = "2021"
license = "MIT"

[features]
default = []
std = ["bitcoin-consensus-encoding?/std", "dash-types/std"]
full = ["std", "codec", "serde"]
codec = ["dep:bitcoin-consensus-encoding", "dash-types/codec"]
serde = ["dep:serde", "dash-types/serde"]

[dependencies]
bitcoin-consensus-encoding = { workspace = true, optional = true }
dash-types = { version = "0.0.0", path = "../types", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
dash-dev = { version = "0.0.0", path = "../dev", features = ["full"] }
divan = "0.1"
hex-literal = "0.4"
rstest = "0.25"
serde = { version = "1", features = ["derive"] }

[[test]]
name = "hash"
path = "tests/hash.rs"

[[test]]
name = "arith"
path = "tests/arith.rs"

[[test]]
name = "compact"
path = "tests/compact.rs"

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]

[[bench]]
name = "num"
path = "bench/main.rs"
harness = false

[lints]
workspace = true

[package.rust-version]
workspace = true

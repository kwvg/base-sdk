[project]
name = "dash-base-sdk"
version = "0.0.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff>=0.9", "semgrep>=1.118.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
indent-width = 2
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
  "ANN", # flake8-annotations
  "B",   # flake8-bugbear
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "RUF", # ruff
  "S",   # flake8-bandit
  "TCH", # flake8-type-checking
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false
